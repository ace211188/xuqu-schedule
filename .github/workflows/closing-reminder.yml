name: 打烊未填提醒

on:
  # 排程已改用 Supabase pg_cron（每天台北 21:30 準時呼叫 closing-reminder Edge Function），
  # 因為 GitHub Actions 的 schedule 會延遲數小時、把提醒拖到半夜。
  # 這裡只保留手動觸發當備援；不要再加回 schedule，否則會重複發送。
  workflow_dispatch:
    inputs:
      mode:
        description: "run(檢查後推播) / test(只推測試給宇群)"
        default: "test"

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 決定模式
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=run" >> "$GITHUB_OUTPUT"
          fi
      - name: 發送
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          SUPABASE_URL: https://gffemhrthwdnajdpkwsq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: mailto:overtureacademyofmusic@gmail.com
        run: node scripts/send-closing-reminder.mjs
